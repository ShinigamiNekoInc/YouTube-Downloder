<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <link rel="icon" type="image/svg+xml" href="img/youtube-fav.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Video Downloader</h1>
        </header>

        <section class="input-section">
            <label for="video_url">VIDEO URL</label>
            <form action="php/download.php" method="POST">
                <input type="url" id="video_url" name="video_url" placeholder="Paste video link here (e.g., https://...)" required>
                <button type="submit" class="main-btn">Download Video</button>
            </form>
        </section>

        <div class="divider">
            <i class="fas fa-sliders-h"></i>
        </div>

        <section class="settings-section">
            <div class="settings-header">
                <span>System Settings</span>
                <div class="settings-controls">
                    <form action="php/update_yt_dlp.php" method="POST">
                        <button type="submit" class="btn-group-item">
                            <i class="fas fa-cog"></i> Update ytl
                        </button>
                    </form>
                </div>
            </div>
        </section>

        <div id="status" class="status-card">
            <!-- Status content will be injected here by JS -->
            <div class="status-content">
                        <div class="status-info">
                            <i id="success_icon" class="fas fa-check-circle success-icon"></i>
                            <span id="status_msg">Download Complete!</span>
                        </div>
                        <a href="#" class="download-file-btn" id="download_link">Download File</a>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
