<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --button-hover: #9965f4;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            margin-bottom: 1.5rem;
            color: var(--accent-color);
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        input[type="url"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #2c2c2c;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--button-hover);
        }

        #status {
            margin-top: 1.5rem;
            padding: 10px;
            border-radius: 8px;
            display: none;
            word-break: break-all;
        }

        .success { background-color: #2e7d32; color: white; }
        .error { background-color: #c62828; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Video Downloader</h1>
        <form action="download.php" method="POST">
            <div class="form-group">
                <label for="video_url">Video URL</label>
                <input type="url" id="video_url" name="video_url" placeholder="https://www.youtube.com/watch?v=..." required>
            </div>
            <button type="submit">Download Video</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const statusDiv = document.getElementById('status');
        const type = urlParams.get('type');
        const taskId = urlParams.get('task_id');

        if (type === 'started' && taskId) {
            statusDiv.style.display = 'block';
            statusDiv.innerText = "Download started. Please wait...";
            statusDiv.className = 'success'; // Using success style for the progress area

            const pollStatus = setInterval(async () => {
                try {
                    const response = await fetch(`status.php?task_id=${taskId}`);
                    const data = await response.json();

                    if (data.status === 'completed') {
                        clearInterval(pollStatus);
                        statusDiv.innerHTML = "Download Complete!";
                        
                        // Re-fetch the final status to get the filename if needed, 
                        // but since we don't have a direct link in status.php yet, 
                        // let's assume the python script finished and we need to provide a download link.
                        // Actually, for this simple flow, we can just tell them it's done.
                        // To make it better, we should ideally pass the filename back or have status.php return the stream link.
                        // Since I want to keep changes minimal:
                        const link = document.createElement('a');
                        link.href = `stream_download.php?file=${encodeURIComponent(data.filename)}`;
                        link.innerText = "Click here to download the file";
                        link.style.display = "block";
                        link.style.marginTop = "10px";
                        statusDiv.appendChild(link);
                    } else if (data.status === 'error') {
                        clearInterval(pollStatus);
                        statusDiv.innerText = "Error: " + data.message;
                        statusDiv.className = 'error';
                    }
                } catch (e) {
                    console.error("Polling error:", e);
                }
            }, 3000);

        } else if (type === 'success') {
            statusDiv.style.display = 'block';
            const message = urlParams.get('message');
            const downloadUrl = urlParams.get('download');
            statusDiv.innerText = message;
            statusDiv.className = 'success';
            
            if (downloadUrl) {
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.innerText = "Click here to download the file";
                link.style.display = "block";
                link.style.marginTop = "10px";
                statusDiv.appendChild(link);
            }
        } else if (type === 'error') {
            statusDiv.style.display = 'block';
            const message = urlParams.get('message');
            statusDiv.innerText = message;
            statusDiv.className = 'error';
        }
    </script>
</body>
</html>
